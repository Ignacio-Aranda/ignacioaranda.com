      (() => {
        const boton = document.getElementById('theme-toggle');
        const raiz = document.documentElement;

        const enClaro = () => raiz.dataset.theme === 'light';

        const sincronizar = () => {
          boton.setAttribute(
            'aria-label',
            enClaro() ? 'Cambiar a tema oscuro' : 'Cambiar a tema claro',
          );
        };

        boton.addEventListener('click', () => {
          if (enClaro()) {
            delete raiz.dataset.theme;
            localStorage.setItem('theme', 'dark');
          } else {
            raiz.dataset.theme = 'light';
            localStorage.setItem('theme', 'light');
          }
          sincronizar();
        });

        sincronizar();
      })();

      (() => {
        const drop = document.querySelector('[data-drop]');
        if (!drop) return;

        document.addEventListener('click', (e) => {
          if (drop.open && !drop.contains(e.target)) drop.open = false;
        });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && drop.open) {
            drop.open = false;
            drop.querySelector('summary').focus();
          }
        });
      })();
    </script></body></html>
